<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Calibrated Golf — Cache Repair</title>
<style>body{font:16px/1.55 system-ui,Arial,sans-serif;background:#f2f2f3;color:#111;max-width:560px;margin:40px auto;padding:24px}button{font-size:17px;background:#1869df;color:white;border:0;border-radius:26px;padding:14px 24px}p{margin:14px 0}#status{font-weight:bold}</style></head>
<body><h2>Calibrated Golf — Update Repair</h2><p>This clears only old app-page caches and unregisters outdated service workers. It does <strong>not</strong> delete saved scores, rounds, IndexedDB or player settings.</p>
<button id="repair">Repair and open Calibrated Golf</button><p id="status" role="status"></p>
<script>
(function(){
 const btn=document.getElementById('repair'),status=document.getElementById('status');
 btn.onclick=async function(){
  btn.disabled=true;status.textContent='Repairing the cached application…';
  if(!navigator.onLine){status.textContent='Please connect to the internet and try again.';btn.disabled=false;return;}
  try{
   if('serviceWorker' in navigator){
    const regs=await navigator.serviceWorker.getRegistrations();
    for(const reg of regs){
     if(new URL(reg.scope).origin===location.origin)await reg.unregister();
    }
   }
   if('caches' in window){
    const keys=await caches.keys();
    for(const key of keys)if(key.startsWith('calibrated-golf-shell-'))await caches.delete(key);
   }
   status.textContent='Old page cache cleared. Opening the latest app…';
   const u=new URL('./Index.html',location.href);
   u.searchParams.set('cg_recovered',String(Date.now()));
   location.replace(u.href);
  }catch(err){status.textContent='Repair could not complete. '+(err&&err.message||'Try again.');btn.disabled=false;}
 };
})();
</script></body></html>
